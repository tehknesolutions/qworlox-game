name: Runner Smoke Test

on:
  push:
    branches:
      - feat/board-simulator-v1
  pull_request:
    branches:
      - main
      - feat/p3-interaction-polish
      - feat/p4-playtest-instrumentation

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner shell
        shell: bash
        run: |
          echo "QWORLOX_RUNNER_SMOKE=START"
          echo "sha=$GITHUB_SHA"
          echo "workspace=$GITHUB_WORKSPACE"
          pwd
          uname -a
          command -v node || true
          node --version || true
          command -v npm || true
          npm --version || true
          echo "QWORLOX_RUNNER_SMOKE=PASS"
